<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse items | FindIt</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="app">
  <header class="topbar">
    <a class="brand-link" href="browse.html">Find<span>It</span></a>
    <nav>
      <a href="browse.html">Browse</a>
      <a href="report.html">Report an item</a>
      <a href="myposts.html">My Posts</a>
      <a href="claims.html">My Claims</a>
      <a id="nav-login" href="login.html">Login</a>
      <a href="profile.html">Profile</a>
      <a id="nav-logout" href="#" hidden>Logout</a>
    </nav>
  </header>
  <main class="container">
    <h1 class="page-title">Lost something? Found something?</h1>
    <p class="page-sub">Browse open announcements from across campus.</p>

    <div class="filters">
      <input id="q" type="search" placeholder="Search for items... (e.g. phone, bag, watch)">
      <select id="kind">
        <option value="">Lost and found</option>
        <option value="lost">Lost</option>
        <option value="found">Found</option>
      </select>
      <select id="category">
        <option value="">All categories</option>
      </select>
    </div>

    <div id="message" class="notice error" role="alert" hidden></div>
    <div id="results" class="grid"></div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">

</head>
<body class="app">
  <header class="topbar">
    <a class="brand-link" href="dashboard.html">Find<span>It</span></a>

      <a href="browse.html">Browse</a>

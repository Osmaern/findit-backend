<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile | FindIt</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body class="app">
  <header class="topbar">
    <a class="brand-link" href="dashboard.html">Find<span>It</span></a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="browse.html">Browse</a>
      <a id="nav-logout" href="#" hidden>Logout</a>
    </nav>
  </header>
  <main class="container narrow">
    <h1 class="page-title">My Profile</h1>
    <div id="message" class="notice error" role="alert" hidden></div>

    <section class="profile-card">
      <h2>Your details</h2>
      <form id="details-form" novalidate>
        <div class="field">
          <label for="full-name">Full name</label>
          <input id="full-name" name="full_name" required minlength="2" maxlength="120" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email (optional)</label>
          <input id="email" name="email" type="email" maxlength="255" autocomplete="email">
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" type="text" readonly>
          <small class="help">To change your phone number, contact the FindIt team.</small>
        </div>
        <button class="primary" type="submit">Save details</button>
      </form>
    </section>

    <section class="profile-card">
      <h2>Change password</h2>
      <form id="password-form" novalidate>
        <div class="field">
          <label for="current-password">Current password</label>
          <input id="current-password" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="new-password">New password</label>
          <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input id="confirm-password" type="password" autocomplete="new-password" required>
        </div>
        <p class="help">Changing your password signs you out on every other device.</p>
        <button class="primary" type="submit">Change password</button>
      </form>
    </section>
  </main>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
